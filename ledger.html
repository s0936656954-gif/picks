<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>團購記帳 · 廠商分潤管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:#f5f0e8;display:flex;min-height:100vh;font-size:14px}

/* ── Sidebar ── */
#sidebar{width:210px;min-width:210px;background:#3a1a08;color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.s-logo{font-size:1rem;font-weight:700;line-height:1.3}
.s-sub{font-size:0.68rem;color:#b89870;margin-top:2px}
.s-card{background:rgba(255,255,255,.1);border-radius:12px;padding:12px}
.s-label{font-size:0.62rem;color:#b89870;margin-bottom:4px;letter-spacing:.5px}
.s-val{font-size:1.4rem;font-weight:700;color:#4ade80;letter-spacing:-1px}
.s-val.yellow{color:#facc15}
.s-divider{font-size:0.62rem;color:#b89870;letter-spacing:.5px;margin-top:4px}
.s-vlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0}
.s-vi{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:0.78rem;cursor:pointer}
.s-vi:hover{color:#f97316}
.s-vi:last-child{border-bottom:none}
.s-va{color:#f97316;font-weight:600}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tabs{background:#fff;border-bottom:1px solid #e8e0d4;display:flex;padding:0 20px;overflow-x:auto}
.tab{padding:13px 18px;font-size:0.82rem;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab.active{color:#1a1a1a;border-bottom-color:#3a1a08;font-weight:700}
.tv{display:none;flex:1;overflow-y:auto;padding:18px 20px}
.tv.active{display:block}

/* ── Toolbar ── */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
input.sb{padding:9px 13px;border-radius:10px;border:1px solid #e8e0d4;background:#fff;font-size:0.82rem;width:200px;outline:none}
input.sb:focus,select.fs:focus{border-color:#c8a97e}
select.fs{padding:9px 12px;border-radius:10px;border:1px solid #e8e0d4;background:#fff;font-size:0.82rem;outline:none;cursor:pointer}
.spacer{flex:1}
.btn{padding:8px 14px;border-radius:9px;font-size:0.76rem;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.82}
.btn-ghost{background:#fff;border:1px solid #e8e0d4;color:#555}
.btn-dark{background:#3a1a08;color:#fff}
.btn-green{background:#22c55e;color:#fff}

/* ── Table ── */
.tw{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 1px 5px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse;font-size:0.8rem;min-width:900px}
th{padding:10px 10px;text-align:left;background:#faf7f3;color:#888;font-weight:600;font-size:0.7rem;letter-spacing:.3px;border-bottom:1px solid #f0ebe2;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:#333}
td{padding:10px 10px;border-bottom:1px solid #f5f1ec;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdf9f5}
.vn{font-weight:600}
.red{color:#ef4444;font-size:0.76rem}
.dash{color:#ccc}
.bdg{padding:2px 9px;border-radius:20px;font-size:0.7rem;font-weight:600;white-space:nowrap}
.bdg-pur{background:#ede9fe;color:#7c3aed}
.bdg-gray{background:#f3f4f6;color:#6b7280}
.bdg-grn{background:#dcfce7;color:#166534}
.bdg-paid{background:#dcfce7;color:#166534}
.bdg-unpaid{background:#fee2e2;color:#991b1b}
.bs{padding:3px 9px;border-radius:6px;font-size:0.7rem;font-weight:600;cursor:pointer;border:none;margin-right:3px}
.bs:hover{opacity:.82}
.bs-pay{background:#22c55e;color:#fff}
.bs-ed{background:#f3f4f6;color:#374151}
.bs-del{background:#fee2e2;color:#991b1b}

/* ── Form ── */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:0.75rem;color:#555;font-weight:600}
.fg input,.fg select,.fg textarea{padding:9px 12px;border-radius:9px;border:1px solid #e8e0d4;font-size:0.85rem;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#c8a97e}
.calc-field{background:#faf7f3;color:#888}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.cb-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.cb-row input{width:16px;height:16px;cursor:pointer;accent-color:#3a1a08}
.cb-row label{font-size:0.83rem;cursor:pointer;font-weight:normal}

/* ── Modal ── */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.mo.open{display:flex}
.mc{background:#fff;border-radius:18px;padding:24px;width:92%;max-width:620px;max-height:92vh;overflow-y:auto}
.mt{font-size:.95rem;font-weight:700;margin-bottom:18px}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* ── Stats ── */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.sc{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.sc-n{font-size:1.5rem;font-weight:300;letter-spacing:-1px;line-height:1}
.sc-l{font-size:0.68rem;color:#aaa;margin-top:4px}
.bar-wrap{background:#fff;border-radius:14px;padding:18px 16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.bar-title{font-size:0.8rem;font-weight:700;margin-bottom:14px;color:#333}
.br{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bl{width:90px;font-size:0.72rem;color:#666;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;background:#f0ebe2;border-radius:4px;height:20px;overflow:hidden}
.bf{height:100%;background:linear-gradient(90deg,#c8a97e,#8B5e3c);border-radius:4px;transition:width .5s}
.bv{width:75px;font-size:0.72rem;color:#666;flex-shrink:0}

/* ── Chat ── */
.chat-box{background:#fff;border-radius:14px;padding:16px;min-height:280px;max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.cm{padding:9px 13px;border-radius:11px;max-width:82%;font-size:0.83rem;line-height:1.6;white-space:pre-wrap}
.cm.user{background:#3a1a08;color:#fff;align-self:flex-end}
.cm.ai{background:#f3ede3;color:#1a1a1a;align-self:flex-start}
.ci-row{display:flex;gap:8px}
.ci{flex:1;padding:10px 14px;border-radius:11px;border:1px solid #e8e0d4;font-size:0.85rem;outline:none;resize:none;font-family:inherit}
.ci:focus{border-color:#c8a97e}
.ak-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ak-lbl{font-size:0.75rem;color:#888;white-space:nowrap}
.ak-input{flex:1;padding:8px 12px;border-radius:9px;border:1px solid #e8e0d4;font-size:0.8rem;outline:none}

.empty{text-align:center;padding:48px 20px;color:#aaa;font-size:.83rem}
.welcome{background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:16px 18px;margin-bottom:16px;font-size:.84rem;color:#664d03}

@media(max-width:700px){
  #sidebar{width:100%;min-width:unset;flex-direction:row;flex-wrap:wrap;padding:12px}
  body{flex-direction:column}
  .s-vlist{display:none}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div>
    <div class="s-logo">🧾 團購記帳</div>
    <div class="s-sub">廠商分潤管理系統</div>
  </div>
  <div class="s-card">
    <div class="s-label">總分潤金額</div>
    <div class="s-val" id="sTotal">$0</div>
  </div>
  <div class="s-card">
    <div class="s-label">未收款金額</div>
    <div class="s-val" id="sUnpaid">$0</div>
  </div>
  <div class="s-card">
    <div class="s-label">本月分潤</div>
    <div class="s-val yellow" id="sMonth">$0</div>
  </div>
  <div class="s-divider">未匯款廠商</div>
  <div class="s-vlist" id="sVendors"></div>
</aside>

<div id="main">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('records')">所有紀錄</div>
    <div class="tab" onclick="switchTab('add')">新增紀錄</div>
    <div class="tab" onclick="switchTab('ai')">AI 對話</div>
    <div class="tab" onclick="switchTab('stats')">統計分析</div>
    <div class="tab" onclick="switchTab('invoice')">發票統計</div>
  </div>

  <!-- 所有紀錄 -->
  <div id="tv-records" class="tv active">
    <div id="welcomeBanner" class="welcome" style="display:none">
      👋 歡迎使用團購記帳！點擊右上角「<strong>還原備份</strong>」匯入現有 JSON 資料，或點「<strong>新增紀錄</strong>」開始記帳。
    </div>
    <div class="toolbar">
      <input type="text" class="sb" id="searchQ" placeholder="搜尋廠商..." oninput="renderTable()">
      <select class="fs" id="fStatus" onchange="renderTable()">
        <option value="">全部狀態</option>
        <option value="已匯款">已匯款</option>
        <option value="未匯款">未匯款</option>
      </select>
      <select class="fs" id="fMonth" onchange="renderTable()">
        <option value="">全部月份</option>
      </select>
      <div class="spacer"></div>
      <button class="btn btn-ghost" onclick="exportCSV()">匯出 CSV</button>
      <button class="btn btn-ghost" onclick="backupJSON()">備份 JSON</button>
      <button class="btn btn-ghost" onclick="document.getElementById('restoreFile').click()">還原備份</button>
      <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreJSON(event)">
      <button class="btn btn-dark" onclick="document.getElementById('csvFile').click()">📥 匯入 Excel CSV</button>
      <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV(event)">
    </div>
    <div class="tw">
      <table>
        <thead><tr>
          <th onclick="sort('date')">日期 ↕</th>
          <th onclick="sort('vendor')">廠商 ↕</th>
          <th onclick="sort('salesAmount')">銷售金額 ↕</th>
          <th>分潤%</th>
          <th onclick="sort('expectedPayment')">應匯金額 ↕</th>
          <th>健保扣</th>
          <th>所得扣</th>
          <th>帳戶</th>
          <th>發票</th>
          <th onclick="sort('paymentStatus')">狀態 ↕</th>
          <th>操作</th>
        </tr></thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
    <div style="font-size:.72rem;color:#aaa;margin-top:10px;text-align:right" id="tCount"></div>
  </div>

  <!-- 新增紀錄 -->
  <div id="tv-add" class="tv">
    <div style="max-width:660px">
      <div style="font-size:.95rem;font-weight:700;margin-bottom:18px">新增記帳紀錄</div>
      <div class="fg2">
        <div class="fg"><label>日期 *</label><input type="date" id="f_date"></div>
        <div class="fg"><label>廠商名稱 *</label><input type="text" id="f_vendor" placeholder="廠商名稱"></div>
        <div class="fg"><label>銷售金額 *</label><input type="number" id="f_sales" min="0" oninput="calcF()"></div>
        <div class="fg"><label>分潤比例 % *</label><input type="number" id="f_rate" min="0" max="100" step="0.1" oninput="calcF()"></div>
        <div class="fg"><label>分潤金額（自動）</label><input class="calc-field" type="text" id="f_comm" readonly></div>
        <div class="fg"><label>調整金額</label><input type="number" id="f_adj" value="0" oninput="calcF()"></div>
        <div class="fg"><label>調整備註</label><input type="text" id="f_adjNote" placeholder="例：代扣780"></div>
        <div class="fg"><label>應匯金額（自動）</label><input class="calc-field" type="text" id="f_exp" readonly></div>
        <div class="fg"><label>發票狀態</label>
          <select id="f_inv"><option value="未開">未開</option><option value="免開">免開</option><option value="已開">已開</option></select>
        </div>
        <div class="fg"><label>收款帳戶</label>
          <select id="f_acct"><option value="">—</option><option value="公司帳戶">公司帳戶</option><option value="個人帳戶">個人帳戶</option></select>
        </div>
        <div class="fg"><label>匯款狀態</label>
          <select id="f_stat"><option value="未匯款">未匯款</option><option value="已匯款">已匯款</option></select>
        </div>
        <div class="fg"><label>發票號碼</label><input type="text" id="f_invNum" placeholder="選填"></div>
      </div>
      <div style="display:flex;gap:24px;margin:8px 0 14px;flex-wrap:wrap">
        <div class="cb-row"><input type="checkbox" id="f_nhi2" onchange="calcF()"><label for="f_nhi2">健保補充保費 (2.11%)</label></div>
        <div class="cb-row"><input type="checkbox" id="f_tax5" onchange="calcF()"><label for="f_tax5">所得稅扣繳 (5%)</label></div>
      </div>
      <div class="fg"><label>備註</label><textarea id="f_notes" rows="2" style="resize:vertical"></textarea></div>
      <button class="btn btn-dark" style="padding:11px 30px;font-size:.88rem" onclick="addRecord()">儲存紀錄</button>
    </div>
  </div>

  <!-- AI 對話 -->
  <div id="tv-ai" class="tv">
    <div style="max-width:700px">
      <div style="font-size:.95rem;font-weight:700;margin-bottom:14px">AI 智能助手</div>
      <div class="ak-row">
        <span class="ak-lbl">Anthropic API Key：</span>
        <input type="password" class="ak-input" id="apiKeyInput" placeholder="sk-ant-...">
        <button class="btn btn-ghost" style="font-size:.76rem" onclick="saveKey()">儲存</button>
      </div>
      <div class="chat-box" id="chatBox">
        <div class="cm ai">你好！我是你的記帳助手 🧾 可以問我：哪個廠商分潤最高？本月收了多少？有哪些未匯款廠商？</div>
      </div>
      <div class="ci-row">
        <textarea class="ci" id="chatIn" rows="2" placeholder="輸入問題..." onkeydown="chatKey(event)"></textarea>
        <button class="btn btn-dark" onclick="sendChat()">送出</button>
      </div>
    </div>
  </div>

  <!-- 統計分析 -->
  <div id="tv-stats" class="tv">
    <div id="statsDiv"></div>
  </div>

  <!-- 發票統計 -->
  <div id="tv-invoice" class="tv">
    <div id="invoiceDiv"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="mo" id="editMo">
  <div class="mc">
    <div class="mt">編輯紀錄</div>
    <input type="hidden" id="e_id">
    <div class="fg2">
      <div class="fg"><label>日期</label><input type="date" id="e_date"></div>
      <div class="fg"><label>廠商</label><input type="text" id="e_vendor"></div>
      <div class="fg"><label>銷售金額</label><input type="number" id="e_sales" oninput="calcE()"></div>
      <div class="fg"><label>分潤%</label><input type="number" id="e_rate" oninput="calcE()"></div>
      <div class="fg"><label>分潤金額</label><input class="calc-field" type="text" id="e_comm" readonly></div>
      <div class="fg"><label>調整金額</label><input type="number" id="e_adj" oninput="calcE()"></div>
      <div class="fg"><label>調整備註</label><input type="text" id="e_adjNote"></div>
      <div class="fg"><label>應匯金額</label><input class="calc-field" type="text" id="e_exp" readonly></div>
      <div class="fg"><label>發票狀態</label>
        <select id="e_inv"><option value="未開">未開</option><option value="免開">免開</option><option value="已開">已開</option></select>
      </div>
      <div class="fg"><label>收款帳戶</label>
        <select id="e_acct"><option value="">—</option><option value="公司帳戶">公司帳戶</option><option value="個人帳戶">個人帳戶</option></select>
      </div>
      <div class="fg"><label>匯款狀態</label>
        <select id="e_stat"><option value="未匯款">未匯款</option><option value="已匯款">已匯款</option></select>
      </div>
      <div class="fg"><label>發票號碼</label><input type="text" id="e_invNum"></div>
      <div class="fg"><label>實際付款金額</label><input type="number" id="e_actual" placeholder="留空=未付"></div>
      <div class="fg"><label>付款日期</label><input type="date" id="e_payDate"></div>
    </div>
    <div style="display:flex;gap:20px;margin:8px 0 12px;flex-wrap:wrap">
      <div class="cb-row"><input type="checkbox" id="e_nhi2" onchange="calcE()"><label for="e_nhi2">健保補充保費 (2.11%)</label></div>
      <div class="cb-row"><input type="checkbox" id="e_tax5" onchange="calcE()"><label for="e_tax5">所得稅扣繳 (5%)</label></div>
    </div>
    <div class="fg"><label>備註</label><textarea id="e_notes" rows="2" style="resize:vertical"></textarea></div>
    <div class="mf">
      <button class="btn btn-ghost" onclick="closeMo()">取消</button>
      <button class="btn btn-dark" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<script>
const SK = 'picks_ledger';
let records = [], sortKey = 'date', sortDir = -1;

/* ── Data ── */
function load() {
  try { records = JSON.parse(localStorage.getItem(SK)) || []; } catch(e) { records = []; }
  if (!records.length) document.getElementById('welcomeBanner').style.display = '';
  else document.getElementById('welcomeBanner').style.display = 'none';
  updateSidebar();
  populateMonths();
}
function save() {
  localStorage.setItem(SK, JSON.stringify(records));
  load();
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,6); }

/* ── Sidebar ── */
function fmt(n) { return '$' + Math.round(n).toLocaleString(); }
function updateSidebar() {
  const total = records.reduce((s,r) => s + (r.totalCommission||0), 0);
  const unpaidAmt = records.filter(r => r.paymentStatus === '未匯款').reduce((s,r) => s + (r.expectedPayment||0), 0);
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthAmt = records.filter(r => (r.date||'').startsWith(ym)).reduce((s,r) => s + (r.totalCommission||0), 0);
  document.getElementById('sTotal').textContent = fmt(total);
  document.getElementById('sUnpaid').textContent = fmt(unpaidAmt);
  document.getElementById('sMonth').textContent = fmt(monthAmt);

  const vmap = {};
  records.filter(r => r.paymentStatus === '未匯款').forEach(r => {
    vmap[r.vendor] = (vmap[r.vendor]||0) + (r.expectedPayment||0);
  });
  const sorted = Object.entries(vmap).sort((a,b) => b[1]-a[1]);
  const el = document.getElementById('sVendors');
  if (!sorted.length) { el.innerHTML = '<div style="font-size:.72rem;color:#6b4c32;padding:6px 0">（無未匯款廠商）</div>'; return; }
  el.innerHTML = sorted.map(([v,a]) => `<div class="s-vi" onclick="filterVendor('${v.replace(/'/g,"\\'")}')"><span>${v}</span><span class="s-va">${fmt(a)}</span></div>`).join('');
}
function filterVendor(v) {
  document.getElementById('searchQ').value = v;
  switchTab('records');
  renderTable();
}

/* ── Tabs ── */
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', ['records','add','ai','stats','invoice'][i]===t));
  document.querySelectorAll('.tv').forEach(el => el.classList.remove('active'));
  document.getElementById('tv-'+t).classList.add('active');
  if (t==='records') renderTable();
  if (t==='stats') renderStats();
  if (t==='invoice') renderInvoice();
}

/* ── Month dropdown ── */
function populateMonths() {
  const months = [...new Set(records.map(r => (r.date||'').substr(0,7)).filter(Boolean))].sort().reverse();
  const sel = document.getElementById('fMonth');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部月份</option>' + months.map(m => `<option value="${m}">${m}</option>`).join('');
  if (months.includes(cur)) sel.value = cur;
}

/* ── Table ── */
function sort(k) { sortDir = sortKey===k ? -sortDir : -1; sortKey=k; renderTable(); }
function renderTable() {
  const q = (document.getElementById('searchQ').value||'').toLowerCase();
  const fs = document.getElementById('fStatus').value;
  const fm = document.getElementById('fMonth').value;
  let rows = records.filter(r => {
    if (q && !(r.vendor||'').toLowerCase().includes(q)) return false;
    if (fs && r.paymentStatus !== fs) return false;
    if (fm && !(r.date||'').startsWith(fm)) return false;
    return true;
  });
  rows.sort((a,b) => {
    let av = a[sortKey]||'', bv = b[sortKey]||'';
    if (typeof av === 'number') return sortDir*(av-bv);
    return sortDir * String(av).localeCompare(String(bv));
  });
  const tb = document.getElementById('tBody');
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="11" class="empty">尚無符合紀錄</td></tr>`;
  } else {
    tb.innerHTML = rows.map(r => {
      const invBdg = r.invoiceStatus==='免開'?'bdg-pur':r.invoiceStatus==='已開'?'bdg-grn':'bdg-gray';
      const stBdg = r.paymentStatus==='已匯款'?'bdg-paid':'bdg-unpaid';
      const nhi = r.nhi2 && r.nhi2Amount ? `<span class="red">-$${r.nhi2Amount.toLocaleString()}</span>` : '<span class="dash">—</span>';
      const tax = r.tax5 && r.tax5Amount ? `<span class="red">-$${r.tax5Amount.toLocaleString()}</span>` : '<span class="dash">—</span>';
      const acct = r.receivingAccount || '<span class="dash">—</span>';
      const payBtn = r.paymentStatus==='未匯款' ? `<button class="bs bs-pay" onclick="markPaid('${r.id}')">✓ 已匯</button>` : '';
      return `<tr>
        <td>${r.date||''}</td>
        <td class="vn">${r.vendor||''}</td>
        <td>$${(r.salesAmount||0).toLocaleString()}</td>
        <td>${r.commissionRate||0}%</td>
        <td>$${(r.expectedPayment||0).toLocaleString()}</td>
        <td>${nhi}</td><td>${tax}</td><td>${acct}</td>
        <td><span class="bdg ${invBdg}">${r.invoiceStatus||'未開'}</span></td>
        <td><span class="bdg ${stBdg}">${r.paymentStatus||'未匯款'}</span></td>
        <td>${payBtn}<button class="bs bs-ed" onclick="openEdit('${r.id}')">編輯</button><button class="bs bs-del" onclick="delRec('${r.id}')">刪除</button></td>
      </tr>`;
    }).join('');
  }
  document.getElementById('tCount').textContent = `共 ${rows.length} 筆（全部 ${records.length} 筆）`;
}

/* ── CRUD ── */
function calcF() {
  const s = parseFloat(document.getElementById('f_sales').value)||0;
  const r = parseFloat(document.getElementById('f_rate').value)||0;
  const a = parseFloat(document.getElementById('f_adj').value)||0;
  const nhi = document.getElementById('f_nhi2').checked;
  const tax = document.getElementById('f_tax5').checked;
  const comm = Math.round(s*r/100*100)/100;
  const exp = Math.round((comm+a)*100)/100;
  document.getElementById('f_comm').value = '$' + comm.toLocaleString();
  document.getElementById('f_exp').value = '$' + exp.toLocaleString();
}

function addRecord() {
  const date = document.getElementById('f_date').value;
  const vendor = document.getElementById('f_vendor').value.trim();
  if (!date || !vendor) { alert('請填寫日期和廠商名稱'); return; }
  const sales = parseFloat(document.getElementById('f_sales').value)||0;
  const rate = parseFloat(document.getElementById('f_rate').value)||0;
  const adj = parseFloat(document.getElementById('f_adj').value)||0;
  const nhi2 = document.getElementById('f_nhi2').checked;
  const tax5 = document.getElementById('f_tax5').checked;
  const comm = Math.round(sales*rate/100*100)/100;
  const nhi2Amt = nhi2 ? Math.round(comm*0.0211) : 0;
  const tax5Amt = tax5 ? Math.round(comm*0.05) : 0;
  const exp = Math.round((comm+adj)*100)/100;
  const rec = {
    id: genId(), date, vendor,
    salesAmount: sales, commissionRate: rate,
    totalCommission: comm, adjustmentAmount: adj,
    adjustmentNote: document.getElementById('f_adjNote').value,
    expectedPayment: exp, actualPayment: null, paymentDate: null,
    paymentMethod: '銀行轉帳',
    invoiceStatus: document.getElementById('f_inv').value,
    invoiceNumber: document.getElementById('f_invNum').value,
    invoiceDate: null,
    paymentStatus: document.getElementById('f_stat').value,
    receivingAccount: document.getElementById('f_acct').value,
    nhi2, nhi2Amount: nhi2Amt, tax5, tax5Amount: tax5Amt,
    difference: 0,
    notes: document.getElementById('f_notes').value
  };
  records.unshift(rec);
  save();
  // reset form
  ['f_date','f_vendor','f_sales','f_rate','f_adj','f_adjNote','f_invNum','f_notes'].forEach(id => {
    const el = document.getElementById(id); el.value = id==='f_adj'?'0':'';
  });
  document.getElementById('f_nhi2').checked = false;
  document.getElementById('f_tax5').checked = false;
  document.getElementById('f_comm').value = '';
  document.getElementById('f_exp').value = '';
  switchTab('records');
}

function markPaid(id) {
  const r = records.find(r => r.id===id);
  if (!r) return;
  r.paymentStatus = '已匯款';
  r.paymentDate = new Date().toISOString().substr(0,10);
  r.actualPayment = r.expectedPayment;
  save(); renderTable();
}

function delRec(id) {
  if (!confirm('確定刪除這筆紀錄？')) return;
  records = records.filter(r => r.id!==id);
  save(); renderTable();
}

function openEdit(id) {
  const r = records.find(r => r.id===id);
  if (!r) return;
  document.getElementById('e_id').value = r.id;
  document.getElementById('e_date').value = r.date||'';
  document.getElementById('e_vendor').value = r.vendor||'';
  document.getElementById('e_sales').value = r.salesAmount||0;
  document.getElementById('e_rate').value = r.commissionRate||0;
  document.getElementById('e_adj').value = r.adjustmentAmount||0;
  document.getElementById('e_adjNote').value = r.adjustmentNote||'';
  document.getElementById('e_inv').value = r.invoiceStatus||'未開';
  document.getElementById('e_invNum').value = r.invoiceNumber||'';
  document.getElementById('e_acct').value = r.receivingAccount||'';
  document.getElementById('e_stat').value = r.paymentStatus||'未匯款';
  document.getElementById('e_nhi2').checked = !!r.nhi2;
  document.getElementById('e_tax5').checked = !!r.tax5;
  document.getElementById('e_notes').value = r.notes||'';
  document.getElementById('e_actual').value = r.actualPayment||'';
  document.getElementById('e_payDate').value = r.paymentDate||'';
  calcE();
  document.getElementById('editMo').classList.add('open');
}

function calcE() {
  const s = parseFloat(document.getElementById('e_sales').value)||0;
  const r = parseFloat(document.getElementById('e_rate').value)||0;
  const a = parseFloat(document.getElementById('e_adj').value)||0;
  const comm = Math.round(s*r/100*100)/100;
  const exp = Math.round((comm+a)*100)/100;
  document.getElementById('e_comm').value = '$' + comm.toLocaleString();
  document.getElementById('e_exp').value = '$' + exp.toLocaleString();
}

function saveEdit() {
  const id = document.getElementById('e_id').value;
  const r = records.find(r => r.id===id);
  if (!r) return;
  const sales = parseFloat(document.getElementById('e_sales').value)||0;
  const rate = parseFloat(document.getElementById('e_rate').value)||0;
  const adj = parseFloat(document.getElementById('e_adj').value)||0;
  const nhi2 = document.getElementById('e_nhi2').checked;
  const tax5 = document.getElementById('e_tax5').checked;
  const comm = Math.round(sales*rate/100*100)/100;
  r.date = document.getElementById('e_date').value;
  r.vendor = document.getElementById('e_vendor').value.trim();
  r.salesAmount = sales; r.commissionRate = rate;
  r.totalCommission = comm; r.adjustmentAmount = adj;
  r.adjustmentNote = document.getElementById('e_adjNote').value;
  r.expectedPayment = Math.round((comm+adj)*100)/100;
  r.invoiceStatus = document.getElementById('e_inv').value;
  r.invoiceNumber = document.getElementById('e_invNum').value;
  r.receivingAccount = document.getElementById('e_acct').value;
  r.paymentStatus = document.getElementById('e_stat').value;
  r.nhi2 = nhi2; r.nhi2Amount = nhi2 ? Math.round(comm*0.0211) : 0;
  r.tax5 = tax5; r.tax5Amount = tax5 ? Math.round(comm*0.05) : 0;
  r.notes = document.getElementById('e_notes').value;
  const act = document.getElementById('e_actual').value;
  r.actualPayment = act ? parseFloat(act) : null;
  r.paymentDate = document.getElementById('e_payDate').value || null;
  r.difference = r.actualPayment != null ? Math.round((r.actualPayment - r.expectedPayment)*100)/100 : 0;
  save(); closeMo(); renderTable();

function closeMo() { document.getElementById('editMo').classList.remove('open'); }
document.getElementById('editMo').addEventListener('click', e => { if (e.target===e.currentTarget) closeMo(); });

/* ── Import / Export ── */
function exportCSV() {
  const bom = '﻿';
  const hdr = ['日期','廠商','銷售金額','分潤%','分潤金額','調整金額','調整備註','應匯金額','實際付款','付款日期','健保扣','所得扣','帳戶','發票狀態','發票號碼','匯款狀態','備註'];
  const rows = records.map(r => [
    r.date, r.vendor, r.salesAmount, r.commissionRate, r.totalCommission,
    r.adjustmentAmount, r.adjustmentNote, r.expectedPayment,
    r.actualPayment||'', r.paymentDate||'',
    r.nhi2Amount||0, r.tax5Amount||0,
    r.receivingAccount, r.invoiceStatus, r.invoiceNumber,
    r.paymentStatus, r.notes
  ].map(v => `"${String(v||'').replace(/"/g,'""')}"`));
  const csv = bom + [hdr.join(','), ...rows.map(r => r.join(','))].join('\n');
  dl(csv, `團購記帳_${today()}.csv`, 'text/csv;charset=utf-8');
}

function backupJSON() {
  dl(JSON.stringify(records, null, 2), `團購記帳_${today()}.json`, 'application/json');
}

function dl(content, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click();
}

function today() { return new Date().toISOString().substr(0,10); }

function restoreJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) { alert('格式錯誤：需為 JSON 陣列'); return; }
      if (!confirm(`即將匯入 ${data.length} 筆資料，現有資料將被取代，確定？`)) return;
      records = data;
      save(); renderTable();
      alert(`成功匯入 ${data.length} 筆紀錄！`);
    } catch(err) { alert('JSON 解析失敗：' + err.message); }
  };
  reader.readAsText(f, 'UTF-8');
  e.target.value = '';
}

function importCSV(e) {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const text = ev.target.result.replace(/^﻿/,'');
    const lines = text.split(/\r?\n/).filter(Boolean);
    if (lines.length < 2) { alert('CSV 內容不足'); return; }
    const header = parseCSVLine(lines[0]);
    const idxMap = {};
    header.forEach((h,i) => idxMap[h.trim()] = i);
    const get = (row, key) => { const i = idxMap[key]; return i!==undefined ? (row[i]||'').trim() : ''; };
    let count = 0;
    for (let i = 1; i < lines.length; i++) {
      const row = parseCSVLine(lines[i]);
      if (!row.length || !get(row,'廠商')) continue;
      const sales = parseFloat(get(row,'銷售金額'))||0;
      const rate = parseFloat(get(row,'分潤%'))||0;
      const adj = parseFloat(get(row,'調整金額'))||0;
      const comm = get(row,'分潤金額') ? parseFloat(get(row,'分潤金額')) : Math.round(sales*rate/100*100)/100;
      const exp = get(row,'應匯金額') ? parseFloat(get(row,'應匯金額')) : Math.round((comm+adj)*100)/100;
      records.push({
        id: genId(),
        date: get(row,'日期'), vendor: get(row,'廠商'),
        salesAmount: sales, commissionRate: rate,
        totalCommission: comm, adjustmentAmount: adj,
        adjustmentNote: get(row,'調整備註'), expectedPayment: exp,
        actualPayment: get(row,'實際付款') ? parseFloat(get(row,'實際付款')) : null,
        paymentDate: get(row,'付款日期')||null,
        paymentMethod: '銀行轉帳',
        invoiceStatus: get(row,'發票狀態')||'未開',
        invoiceNumber: get(row,'發票號碼'), invoiceDate: null,
        paymentStatus: get(row,'匯款狀態')||'未匯款',
        receivingAccount: get(row,'帳戶')||'',
        nhi2: false, nhi2Amount: 0, tax5: false, tax5Amount: 0,
        difference: 0, notes: get(row,'備註')
      });
      count++;
    }
    save(); renderTable();
    alert(`成功匯入 ${count} 筆紀錄！`);
  };
  reader.readAsText(f, 'UTF-8');
  e.target.value = '';
}

function parseCSVLine(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c==='"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
    else if (c===',' && !inQ) { result.push(cur); cur=''; }
    else cur+=c;
  }
  result.push(cur);
  return result;
}

/* ── Statistics ── */
function renderStats() {
  const total = records.reduce((s,r) => s+(r.totalCommission||0), 0);
  const totalSales = records.reduce((s,r) => s+(r.salesAmount||0), 0);
  const paid = records.filter(r=>r.paymentStatus==='已匯款').reduce((s,r)=>s+(r.expectedPayment||0),0);
  const unpaid = records.filter(r=>r.paymentStatus==='未匯款').reduce((s,r)=>s+(r.expectedPayment||0),0);

  // Monthly data
  const mmap = {};
  records.forEach(r => {
    const m = (r.date||'').substr(0,7);
    if (m) mmap[m] = (mmap[m]||0) + (r.totalCommission||0);
  });
  const months = Object.keys(mmap).sort().slice(-12);
  const maxM = Math.max(...months.map(m=>mmap[m]), 1);

  // Vendor data
  const vmap = {};
  records.forEach(r => { vmap[r.vendor] = (vmap[r.vendor]||0) + (r.totalCommission||0); });
  const vendors = Object.entries(vmap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxV = Math.max(...vendors.map(v=>v[1]), 1);

  document.getElementById('statsDiv').innerHTML = `
    <div class="sg">
      <div class="sc"><div class="sc-n">${records.length}</div><div class="sc-l">總筆數</div></div>
      <div class="sc"><div class="sc-n">$${Math.round(totalSales/10000)}萬</div><div class="sc-l">總銷售額</div></div>
      <div class="sc"><div class="sc-n">$${Math.round(total/10000)}萬</div><div class="sc-l">總分潤</div></div>
      <div class="sc"><div class="sc-n" style="color:#22c55e">$${Math.round(paid/10000)}萬</div><div class="sc-l">已收款</div></div>
      <div class="sc"><div class="sc-n" style="color:#ef4444">$${Math.round(unpaid/10000)}萬</div><div class="sc-l">未收款</div></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-title">📅 月度分潤（近 ${months.length} 個月）</div>
      <div class="bar-chart">${months.reverse().map(m=>`
        <div class="br">
          <div class="bl">${m.substr(5)}</div>
          <div class="bt"><div class="bf" style="width:${Math.round(mmap[m]/maxM*100)}%"></div></div>
          <div class="bv">$${Math.round(mmap[m]/1000)}K</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="bar-wrap">
      <div class="bar-title">🏆 廠商分潤排行（前 ${vendors.length} 名）</div>
      <div class="bar-chart">${vendors.map(([v,a])=>`
        <div class="br">
          <div class="bl">${v}</div>
          <div class="bt"><div class="bf" style="width:${Math.round(a/maxV*100)}%"></div></div>
          <div class="bv">$${Math.round(a/1000)}K</div>
        </div>`).join('')}
      </div>
    </div>`;
}

/* ── AI Chat ── */
function saveKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  if (!k) return;
  localStorage.setItem('ak_ledger', k);
  alert('API Key 已儲存');
}

window.addEventListener('load', () => {
  const k = localStorage.getItem('ak_ledger');
  if (k) document.getElementById('apiKeyInput').value = k;
});

function chatKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

async function sendChat() {
  const input = document.getElementById('chatIn');
  const msg = input.value.trim();
  if (!msg) return;
  const key = document.getElementById('apiKeyInput').value.trim() || localStorage.getItem('ak_ledger');
  if (!key) { alert('請先輸入 Anthropic API Key'); return; }

  input.value = '';
  appendMsg('user', msg);

  const summary = buildSummary();
  const aiEl = appendMsg('ai', '…');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        system: `你是一個團購記帳助手，請用繁體中文回答。以下是記帳摘要：\n${summary}`,
        messages: [{ role: 'user', content: msg }]
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || (data.error?.message) || '無法取得回應';
    aiEl.textContent = reply;
  } catch(e) { aiEl.textContent = '連線失敗：' + e.message; }
}

function buildSummary() {
  const total = records.reduce((s,r)=>s+(r.totalCommission||0),0);
  const unpaid = records.filter(r=>r.paymentStatus==='未匯款');
  const unpaidAmt = unpaid.reduce((s,r)=>s+(r.expectedPayment||0),0);
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const thisMonth = records.filter(r=>(r.date||'').startsWith(ym));
  const monthAmt = thisMonth.reduce((s,r)=>s+(r.totalCommission||0),0);
  const vmap = {};
  records.forEach(r=>{vmap[r.vendor]=(vmap[r.vendor]||0)+(r.totalCommission||0);});
  const top5 = Object.entries(vmap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `總分潤：$${Math.round(total).toLocaleString()}，總筆數：${records.length}，未匯款：${unpaid.length}筆 $${Math.round(unpaidAmt).toLocaleString()}，本月分潤：$${Math.round(monthAmt).toLocaleString()}。分潤前5廠商：${top5.map(([v,a])=>`${v}($${Math.round(a).toLocaleString()})`).join('、')}。未匯款廠商：${unpaid.slice(0,8).map(r=>`${r.vendor}(${r.date},$${r.expectedPayment})`).join('、')}`;
}

function appendMsg(role, text) {
  const box = document.getElementById('chatBox');
  const el = document.createElement('div');
  el.className = `cm ${role}`;
  el.textContent = text;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}
