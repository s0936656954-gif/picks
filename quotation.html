<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報價單 · 微絜</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f4f1ec;
    color: #1a1a1a;
    font-family: -apple-system, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100vh;
    padding: 20px 14px 60px;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
  }

  .brand {
    text-align: center;
    margin-bottom: 18px;
  }
  .brand-name { font-size: 1rem; font-weight: 700; }
  .brand-sub { font-size: 0.7rem; color: #aaa; margin-top: 2px; }

  .sheet {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    padding: 24px 20px;
    margin-bottom: 16px;
  }

  .sheet-title {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 4px;
  }
  .sheet-title-en {
    font-size: 0.65rem;
    color: #c8a97e;
    text-align: center;
    letter-spacing: 3px;
    margin-bottom: 20px;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    margin-bottom: 18px;
  }
  .meta-field { display: flex; flex-direction: column; gap: 4px; }
  .meta-field.full { grid-column: 1 / -1; }
  .meta-label { font-size: 0.65rem; color: #aaa; font-weight: 600; }
  .meta-input {
    border: 1px solid #ede9e3;
    background: #f7f5f2;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.82rem;
    color: #1a1a1a;
    outline: none;
    font-family: inherit;
  }
  .meta-input:focus { border-color: #c8a97e; }

  .section-label {
    font-size: 0.65rem; color: #aaa; font-weight: 600;
    letter-spacing: 1px; margin-bottom: 8px;
  }

  table.items {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 10px;
  }
  table.items th {
    font-size: 0.62rem; color: #aaa; font-weight: 600;
    text-align: left; padding: 6px 4px; border-bottom: 1px solid #ede9e3;
  }
  table.items th.num, table.items td.num { text-align: right; }
  table.items td {
    padding: 6px 4px; border-bottom: 1px solid #f2eeea;
    vertical-align: middle;
  }
  .cell-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 0.82rem;
    color: #1a1a1a;
    outline: none;
    font-family: inherit;
    padding: 4px 2px;
    border-radius: 6px;
  }
  .cell-input:focus { background: #f7f5f2; }
  .cell-input.num { text-align: right; }
  .col-name { width: 42%; }
  .col-qty { width: 14%; }
  .col-price { width: 20%; }
  .col-sub { width: 20%; }
  .col-del { width: 24px; }

  .row-del {
    background: none; border: none; color: #ccc; font-size: 1rem;
    cursor: pointer; padding: 2px 4px; line-height: 1;
  }
  .row-del:active { color: #c0392b; }

  .add-row-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px dashed #ddd6cb;
    background: #f7f5f2;
    color: #999;
    font-size: 0.78rem;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .add-row-btn:active { background: #f0ece4; }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 14px;
    border-top: 2px solid #1a1a1a;
  }
  .total-label { font-size: 0.85rem; font-weight: 700; }
  .total-value { font-size: 1.5rem; font-weight: 300; letter-spacing: -0.5px; }
  .total-value .cur { font-size: 0.8rem; font-weight: 500; margin-right: 2px; }

  .notes-area {
    width: 100%;
    min-height: 60px;
    border: 1px solid #ede9e3;
    background: #f7f5f2;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.78rem;
    color: #555;
    outline: none;
    font-family: inherit;
    resize: vertical;
    margin-top: 18px;
  }
  .notes-area:focus { border-color: #c8a97e; }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .btn {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 0.82rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    text-align: center;
  }
  .btn-primary { background: #1a1a1a; color: #fff; }
  .btn-primary:active { background: #333; }
  .btn-secondary { background: #fff; color: #888; border: 1px solid #ede9e3; }
  .btn-secondary:active { background: #f7f5f2; }

  .foot-note {
    text-align: center;
    font-size: 0.62rem;
    color: #ccc;
    margin-top: 14px;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .brand, .actions, .add-row-btn, .row-del, .foot-note { display: none !important; }
    .sheet { box-shadow: none; border-radius: 0; padding: 4px; }
    .meta-input, .cell-input, .notes-area { border-color: transparent !important; background: transparent !important; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="brand">
    <div class="brand-name">微絜 · @jay1102</div>
    <div class="brand-sub">報價單產生工具</div>
  </div>

  <div class="sheet">
    <div class="sheet-title">報　價　單</div>
    <div class="sheet-title-en">QUOTATION</div>

    <div class="meta-grid">
      <div class="meta-field">
        <div class="meta-label">報價單號</div>
        <input class="meta-input" id="quoNo" placeholder="自動產生">
      </div>
      <div class="meta-field">
        <div class="meta-label">日期</div>
        <input class="meta-input" id="quoDate" type="date">
      </div>
      <div class="meta-field full">
        <div class="meta-label">客戶 / 廠商名稱</div>
        <input class="meta-input" id="quoClient" placeholder="請輸入名稱">
      </div>
      <div class="meta-field full">
        <div class="meta-label">聯絡方式（選填）</div>
        <input class="meta-input" id="quoContact" placeholder="電話 / IG / Email">
      </div>
    </div>

    <div class="section-label">品項明細</div>
    <table class="items">
      <thead>
        <tr>
          <th class="col-name">品名</th>
          <th class="col-qty num">數量</th>
          <th class="col-price num">單價</th>
          <th class="col-sub num">小計</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <button class="add-row-btn" onclick="addRow()">＋ 新增品項</button>

    <div class="total-row">
      <div class="total-label">總計</div>
      <div class="total-value"><span class="cur">NT$</span><span id="totalVal">0</span></div>
    </div>

    <textarea class="notes-area" id="quoNotes" placeholder="備註（付款方式、有效期限、出貨說明⋯）"></textarea>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="resetForm()">清空重填</button>
    <button class="btn btn-primary" onclick="window.print()">🖨 列印 / 存成 PDF</button>
  </div>

  <div class="foot-note">內容會自動儲存在此裝置瀏覽器中</div>
</div>

<script>
  const STORAGE_KEY = 'jay1102_quotation_draft';
  let rowSeq = 0;

  function genQuoNo() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*900)+100);
    return `Q${y}${m}${day}-${rand}`;
  }

  function fmtNum(n) {
    if (!isFinite(n)) return '0';
    return Math.round(n).toLocaleString('en-US');
  }

  function addRow(data) {
    const id = `row${rowSeq++}`;
    const tr = document.createElement('tr');
    tr.id = id;
    tr.innerHTML = `
      <td class="col-name"><input class="cell-input" placeholder="品項名稱" value="${data?.name ? escHtml(data.name) : ''}" oninput="calcTotal()"></td>
      <td class="col-qty num"><input class="cell-input num" type="number" min="0" placeholder="1" value="${data?.qty ?? ''}" oninput="calcTotal()"></td>
      <td class="col-price num"><input class="cell-input num" type="number" min="0" placeholder="0" value="${data?.price ?? ''}" oninput="calcTotal()"></td>
      <td class="col-sub num sub-cell">0</td>
      <td class="col-del"><button class="row-del" onclick="removeRow('${id}')">✕</button></td>
    `;
    document.getElementById('itemsBody').appendChild(tr);
    calcTotal();
  }

  function removeRow(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
    calcTotal();
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function calcTotal() {
    let total = 0;
    document.querySelectorAll('#itemsBody tr').forEach(tr => {
      const inputs = tr.querySelectorAll('.cell-input');
      const qty = parseFloat(inputs[1].value) || 0;
      const price = parseFloat(inputs[2].value) || 0;
      const sub = qty * price;
      tr.querySelector('.sub-cell').textContent = fmtNum(sub);
      total += sub;
    });
    document.getElementById('totalVal').textContent = fmtNum(total);
    saveDraft();
  }

  function collectState() {
    const items = [];
    document.querySelectorAll('#itemsBody tr').forEach(tr => {
      const inputs = tr.querySelectorAll('.cell-input');
      items.push({ name: inputs[0].value, qty: inputs[1].value, price: inputs[2].value });
    });
    return {
      quoNo: document.getElementById('quoNo').value,
      quoDate: document.getElementById('quoDate').value,
      quoClient: document.getElementById('quoClient').value,
      quoContact: document.getElementById('quoContact').value,
      quoNotes: document.getElementById('quoNotes').value,
      items
    };
  }

  function saveDraft() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState())); } catch(e) {}
  }

  ['quoNo','quoDate','quoClient','quoContact','quoNotes'].forEach(id => {
    document.getElementById(id).addEventListener('input', saveDraft);
  });

  function resetForm() {
    if (!confirm('確定要清空目前的報價單內容嗎？')) return;
    localStorage.removeItem(STORAGE_KEY);
    initForm(true);
  }

  function initForm(forceFresh) {
    document.getElementById('itemsBody').innerHTML = '';
    let saved = null;
    if (!forceFresh) {
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) {}
    }

    if (saved) {
      document.getElementById('quoNo').value = saved.quoNo || genQuoNo();
      document.getElementById('quoDate').value = saved.quoDate || today();
      document.getElementById('quoClient').value = saved.quoClient || '';
      document.getElementById('quoContact').value = saved.quoContact || '';
      document.getElementById('quoNotes').value = saved.quoNotes || '';
      if (saved.items && saved.items.length) {
        saved.items.forEach(it => addRow(it));
      } else {
        addRow(); addRow(); addRow();
      }
    } else {
      document.getElementById('quoNo').value = genQuoNo();
      document.getElementById('quoDate').value = today();
      addRow(); addRow(); addRow();
    }
    calcTotal();
  }

  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  initForm(false);
</script>
</body>
</html>
