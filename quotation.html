<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>吊運作業報價單</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2947">

<!-- iOS 加入主畫面 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="報價單">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Android 加入主畫面 -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
  :root {
    --navy: #0b2947;
    --navy-dark: #071b30;
    --navy-mid: #12395f;
    --orange: #f4600c;
    --orange-dark: #d14f06;
    --bg: #e9edf1;
    --card-bg: #ffffff;
    --border: #d2dae2;
    --text: #16202a;
    --text-mute: #6b7a89;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }

  /* ── Top bar ── */
  .topbar {
    background: var(--navy);
    border-bottom: 3px solid var(--orange);
    padding: 14px 16px;
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-title { font-size: 0.95rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
  .mode-switch { display: flex; gap: 6px; }
  .mode-btn {
    padding: 7px 12px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
    background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.25); cursor: pointer;
  }
  .mode-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

  .page { max-width: 640px; margin: 0 auto; padding: 16px 14px; }

  /* ── Edit form ── */
  #editView.hidden, #previewView.hidden, #historyView.hidden { display: none; }

  .card {
    background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border);
    border-left: 4px solid var(--navy);
    box-shadow: 0 1px 4px rgba(11,41,71,0.06);
    padding: 18px 16px; margin-bottom: 14px;
  }
  .card-label {
    font-size: 0.68rem; color: var(--navy); font-weight: 800; letter-spacing: 1px;
    margin-bottom: 10px; text-transform: uppercase;
  }
  .card-label-row {
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .card-toggle-btn {
    font-size: 0.68rem; font-weight: 700; color: var(--navy-mid);
    background: #f4f7f9; border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  .company-summary {
    font-size: 0.8rem; color: var(--text-mute); line-height: 1.6; margin-top: 2px;
  }
  .company-summary.hidden, #companyFields.hidden { display: none; }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }
  .field-label { font-size: 0.68rem; color: var(--text-mute); margin-bottom: 4px; display: block; }
  .field-input, .field-textarea {
    width: 100%; border: 1px solid var(--border); background: #f4f7f9;
    border-radius: 6px; padding: 10px 12px; font-size: 0.85rem;
    color: var(--text); outline: none; font-family: inherit;
  }
  .field-input:focus, .field-textarea:focus { border-color: var(--orange); background: #fff; }
  .field-textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

  /* Item rows (edit mode) */
  .item-edit-row {
    border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px;
    background: #f4f7f9; position: relative;
  }
  .item-edit-row .field-row { margin-bottom: 8px; }
  .item-edit-row .field-row:last-child { margin-bottom: 0; }
  .item-del-btn {
    position: absolute; top: 8px; right: 8px; background: none; border: none;
    color: #b7c2cc; font-size: 1rem; cursor: pointer; padding: 2px 6px;
  }
  .item-del-btn:active { color: var(--orange-dark); }
  .item-idx {
    font-size: 0.7rem; color: var(--orange); font-weight: 800; margin-bottom: 6px;
  }

  .add-item-btn {
    width: 100%; padding: 12px; border-radius: 6px; border: 1px dashed var(--orange);
    background: #fff3ea; color: var(--orange-dark); font-size: 0.8rem; font-weight: 700; cursor: pointer;
  }
  .add-item-btn:active { background: #ffe6d4; }

  .stamp-row { display: flex; align-items: center; gap: 12px; }
  .stamp-preview {
    width: 64px; height: 64px; border-radius: 6px; border: 1px solid var(--border);
    background: #f4f7f9 center/contain no-repeat; flex-shrink: 0;
  }
  .stamp-actions { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .stamp-btn {
    font-size: 0.75rem; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; color: var(--navy-mid); cursor: pointer; text-align: center; font-weight: 600;
  }
  .stamp-btn.danger { color: var(--orange-dark); }

  /* ── History list ── */
  .history-save-btn {
    width: 100%; padding: 13px; border-radius: 6px; border: none;
    background: var(--navy); color: #fff; font-size: 0.82rem; font-weight: 700;
    cursor: pointer; margin-bottom: 14px;
  }
  .history-save-btn:active { background: var(--navy-mid); }
  .history-item {
    background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--orange);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .history-info { flex: 1; min-width: 0; }
  .history-client { font-size: 0.85rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-meta { font-size: 0.68rem; color: var(--text-mute); margin-top: 2px; }
  .history-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .history-btn {
    font-size: 0.72rem; font-weight: 700; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: #f4f7f9; color: var(--navy-mid); cursor: pointer;
  }
  .history-btn.danger { color: var(--orange-dark); border-color: #f3c7ab; background: #fff3ea; }
  .history-empty { text-align: center; font-size: 0.78rem; color: var(--text-mute); padding: 30px 0; }

  /* ── Bottom action bar ── */
  .action-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--navy);
    border-top: 3px solid var(--orange); padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; z-index: 30;
  }
  .btn {
    flex: 1; padding: 13px; border-radius: 6px; font-size: 0.82rem; font-weight: 700;
    border: none; cursor: pointer; text-align: center;
  }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-primary:active { background: var(--orange-dark); }
  .btn-primary:disabled { background: #7a8794; }
  .btn-secondary { background: transparent; color: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.3); }
  .btn-secondary:active { background: rgba(255,255,255,0.1); }

  /* ── Preview / print sheet ── */
  #previewView { padding: 16px 14px; }
  .sheet-outer {
    background: #fff; border-radius: 14px; box-shadow: 0 1px 10px rgba(0,0,0,0.08);
    padding: 10px; margin-bottom: 14px; overflow-x: auto;
  }
  #sheet {
    background: #fff; width: 794px; padding: 46px 50px; color: #111;
    font-family: 'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
    margin: 0 auto;
  }
  .sheet-header { text-align: center; margin-bottom: 22px; }
  .sheet-company { font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  .sheet-line { font-size: 16px; margin-top: 8px; }
  .sheet-client-line { font-size: 16px; margin-top: 4px; }

  table.sheet-table {
    width: 100%; border-collapse: collapse; margin-bottom: 20px;
  }
  table.sheet-table th, table.sheet-table td {
    border: 1px solid #111; padding: 10px 8px; font-size: 15px; text-align: center;
  }
  table.sheet-table th { font-weight: 700; background: #fafafa; }
  table.sheet-table td.name-cell { text-align: left; }

  .sheet-notes { font-size: 14.5px; line-height: 2; }
  .sheet-notes .note-title { font-weight: 700; margin-bottom: 4px; }
  .sheet-notes pre { font-family: inherit; white-space: pre-wrap; word-break: break-word; }

  .sheet-stamp-wrap { display: flex; justify-content: flex-end; margin-top: 30px; }
  .sheet-stamp-wrap img { width: 150px; height: auto; }

  .empty-hint { text-align: center; font-size: 0.75rem; color: #ccc; padding: 20px 0; }

  @media print {
    body { background: #fff; }
    .topbar, .action-bar, #editView, #historyView { display: none !important; }
    .sheet-outer { box-shadow: none; padding: 0; }
    #sheet { width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">🏗️ 吊運作業報價單</div>
  <div class="mode-switch">
    <button class="mode-btn active" id="btnModeEdit" onclick="switchMode('edit')">填寫</button>
    <button class="mode-btn" id="btnModePreview" onclick="switchMode('preview')">預覽</button>
    <button class="mode-btn" id="btnModeHistory" onclick="switchMode('history')">紀錄</button>
  </div>
</div>

<!-- ══ EDIT VIEW ══ -->
<div id="editView" class="page">

  <div class="card">
    <div class="card-label-row" onclick="toggleCompanyCard()">
      <div class="card-label" style="margin-bottom:0">公司資訊</div>
      <button class="card-toggle-btn" id="companyToggleBtn" type="button">編輯</button>
    </div>
    <div class="company-summary" id="companySummary"></div>
    <div id="companyFields" class="hidden">
      <div class="field" style="margin-top:12px">
        <label class="field-label">公司名稱</label>
        <input class="field-input" id="companyName" placeholder="統森企業有限公司">
      </div>
      <div class="field">
        <label class="field-label">報價單標題</label>
        <input class="field-input" id="companySubtitle" placeholder="吊運作業報價單">
      </div>
      <div class="field">
        <label class="field-label">地址</label>
        <input class="field-input" id="companyAddr" placeholder="高雄市大樹區竹寮里竹寮路723號">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">電話</label>
          <input class="field-input" id="companyTel" placeholder="(07)651-4331">
        </div>
        <div class="field">
          <label class="field-label">傳真</label>
          <input class="field-input" id="companyFax" placeholder="(07)651-5584">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">客戶 / 報價資訊</div>
    <div class="field">
      <label class="field-label">客戶公司名稱</label>
      <input class="field-input" id="clientName" placeholder="請輸入客戶公司名稱">
    </div>
    <div class="field">
      <label class="field-label">報價日期</label>
      <input class="field-input" id="quoDate" type="date">
    </div>
  </div>

  <div class="card">
    <div class="card-label">報價項目</div>
    <div id="itemsEditList"></div>
    <button class="add-item-btn" onclick="addItem()">＋ 新增項目</button>
  </div>

  <div class="card">
    <div class="card-label">備註條款</div>
    <div class="field">
      <textarea class="field-textarea" id="notesText"></textarea>
    </div>
  </div>

  <div class="card">
    <div class="card-label">公司印章（選填）</div>
    <div class="stamp-row">
      <div class="stamp-preview" id="stampPreview"></div>
      <div class="stamp-actions">
        <label class="stamp-btn" for="stampFile">上傳印章圖片</label>
        <input type="file" id="stampFile" accept="image/*" style="display:none" onchange="onStampUpload(event)">
        <button class="stamp-btn danger" onclick="removeStamp()">移除印章</button>
      </div>
    </div>
  </div>

</div>

<!-- ══ PREVIEW VIEW ══ -->
<div id="previewView" class="page hidden">
  <div class="sheet-outer">
    <div id="sheet">
      <div class="sheet-header">
        <div class="sheet-company" id="pvCompanyLine"></div>
        <div class="sheet-line" id="pvAddr"></div>
        <div class="sheet-line" id="pvTelFax"></div>
        <div class="sheet-client-line" id="pvClient"></div>
      </div>

      <table class="sheet-table">
        <thead>
          <tr>
            <th style="width:8%">項次</th>
            <th style="width:27%">項目</th>
            <th style="width:19%">半天</th>
            <th style="width:19%">一天</th>
            <th style="width:19%">加班1H</th>
            <th style="width:8%">備註</th>
          </tr>
        </thead>
        <tbody id="pvItemsBody"></tbody>
      </table>

      <div class="sheet-notes">
        <div class="note-title">備註：</div>
        <pre id="pvNotes"></pre>
        <div id="pvDateLine" style="margin-top:4px;"></div>
      </div>

      <div class="sheet-stamp-wrap" id="pvStampWrap"></div>
    </div>
  </div>
  <div class="empty-hint">預覽會依填寫內容自動更新，確認無誤後點下方「產生 PDF」</div>
</div>

<!-- ══ HISTORY VIEW ══ -->
<div id="historyView" class="page hidden">
  <button class="history-save-btn" onclick="saveCurrentAsRecord(true)">💾 將目前內容存為新紀錄</button>
  <div id="historyList"></div>
</div>

<div class="action-bar">
  <button class="btn btn-secondary" onclick="resetForm()">清空重填</button>
  <button class="btn btn-primary" id="btnPdf" onclick="exportPdf()">⬇ 產生 PDF</button>
</div>

<script>
  const STORAGE_KEY = 'sunsen_quotation_draft';
  const HISTORY_KEY = 'sunsen_quotation_history';
  let itemSeq = 0;

  const DEFAULTS = {
    companyName: '統森企業有限公司',
    companySubtitle: '吊運作業報價單',
    companyAddr: '地址：高雄市大樹區竹寮里竹寮路723號',
    companyTel: '(07)651-4331',
    companyFax: '(07)651-5584',
    notesText:
`一、工作時間為 08:00~12:00、13:00~17:00，加班費另計。
二、本公司配有搭乘設備租借，費用如下。
   活動式吊籃 1,000元　固定式吊籃 1,500元
   合格活動式吊籃 2,000元　合格固定式吊籃 2,500元
三、本報價以本公司車輛為主，若因現場需求調動同業車輛，以該同業費用計價。
四、以上報價未含5%營業稅，稅金另計。
五、此報價單自開立日起一個月內有效，逾期請重新洽詢報價。`
  };

  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function migrateNotesText(saved) {
    if (saved === undefined || saved === null) return DEFAULTS.notesText;
    if (saved.includes('一個月內有效')) return saved;
    const trimmed = saved.replace(/\s+$/, '');
    return trimmed ? `${trimmed}\n五、此報價單自開立日起一個月內有效，逾期請重新洽詢報價。` : DEFAULTS.notesText;
  }

  function toROCDateStr(str) {
    if (!str) return '';
    const [y, m, d] = str.split('-').map(Number);
    if (!y) return '';
    return `六、報價日期：民國 ${y - 1911} 年 ${String(m).padStart(2,'0')} 月 ${String(d).padStart(2,'0')} 日`;
  }

  function switchMode(mode) {
    document.getElementById('editView').classList.toggle('hidden', mode !== 'edit');
    document.getElementById('previewView').classList.toggle('hidden', mode !== 'preview');
    document.getElementById('historyView').classList.toggle('hidden', mode !== 'history');
    document.getElementById('btnModeEdit').classList.toggle('active', mode === 'edit');
    document.getElementById('btnModePreview').classList.toggle('active', mode === 'preview');
    document.getElementById('btnModeHistory').classList.toggle('active', mode === 'history');
    if (mode === 'preview') renderPreview();
    if (mode === 'history') renderHistoryList();
  }

  function toggleCompanyCard(forceExpanded) {
    const fields = document.getElementById('companyFields');
    const summary = document.getElementById('companySummary');
    const btn = document.getElementById('companyToggleBtn');
    const expanded = forceExpanded !== undefined ? forceExpanded : fields.classList.contains('hidden');
    fields.classList.toggle('hidden', !expanded);
    summary.classList.toggle('hidden', expanded);
    btn.textContent = expanded ? '收合' : '編輯';
  }

  function renderCompanySummary() {
    const name = document.getElementById('companyName').value;
    const sub = document.getElementById('companySubtitle').value;
    document.getElementById('companySummary').textContent = [name, sub].filter(Boolean).join('　');
  }

  /* ── Saved quotation history ── */
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; }
  }

  function saveHistory(arr) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); } catch(e) {}
  }

  function saveCurrentAsRecord(showAlert) {
    const state = collectState();
    const history = loadHistory();
    history.unshift({
      id: `q${Date.now()}`,
      savedAt: new Date().toISOString(),
      ...state
    });
    saveHistory(history);
    if (showAlert) {
      renderHistoryList();
      alert('已存為新紀錄');
    }
  }

  function fmtSavedAt(iso) {
    const d = new Date(iso);
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${mm}/${dd} ${hh}:${mi} 儲存`;
  }

  function renderHistoryList() {
    const history = loadHistory();
    const el = document.getElementById('historyList');
    if (!history.length) {
      el.innerHTML = '<div class="history-empty">尚無已儲存的報價紀錄</div>';
      return;
    }
    el.innerHTML = history.map(rec => `
      <div class="history-item">
        <div class="history-info">
          <div class="history-client">${escHtml(rec.clientName || '（未填客戶名稱）')}</div>
          <div class="history-meta">報價日期 ${escHtml(rec.quoDate || '-')}　·　${fmtSavedAt(rec.savedAt)}</div>
        </div>
        <div class="history-actions">
          <button class="history-btn" onclick="loadRecord('${rec.id}')">開啟</button>
          <button class="history-btn danger" onclick="deleteRecord('${rec.id}')">刪除</button>
        </div>
      </div>`).join('');
  }

  function loadRecord(id) {
    const history = loadHistory();
    const rec = history.find(r => r.id === id);
    if (!rec) return;
    if (!confirm('開啟這筆紀錄會覆蓋目前填寫中的內容，確定要開啟嗎？')) return;
    applyState(rec);
    saveDraft();
    switchMode('edit');
  }

  function deleteRecord(id) {
    if (!confirm('確定要刪除這筆報價紀錄嗎？此動作無法復原。')) return;
    saveHistory(loadHistory().filter(r => r.id !== id));
    renderHistoryList();
  }

  function addItem(data) {
    const id = `item${itemSeq++}`;
    const wrap = document.createElement('div');
    wrap.className = 'item-edit-row';
    wrap.id = id;
    wrap.innerHTML = `
      <button class="item-del-btn" onclick="removeItem('${id}')">✕</button>
      <div class="item-idx">項目 ${document.querySelectorAll('.item-edit-row').length + 1}</div>
      <div class="field-row">
        <div class="field" style="flex:2">
          <label class="field-label">項目名稱</label>
          <input class="field-input it-name" placeholder="例如：60T" value="${data?.name ? escHtml(data.name) : ''}" oninput="saveDraft()">
        </div>
        <div class="field">
          <label class="field-label">備註</label>
          <input class="field-input it-note" placeholder="選填" value="${data?.note ? escHtml(data.note) : ''}" oninput="saveDraft()">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">半天</label>
          <input class="field-input it-half" type="number" min="0" placeholder="0" value="${data?.half ?? ''}" oninput="saveDraft()">
        </div>
        <div class="field">
          <label class="field-label">一天</label>
          <input class="field-input it-full" type="number" min="0" placeholder="0" value="${data?.full ?? ''}" oninput="saveDraft()">
        </div>
        <div class="field">
          <label class="field-label">加班1H</label>
          <input class="field-input it-ot" type="number" min="0" placeholder="0" value="${data?.ot ?? ''}" oninput="saveDraft()">
        </div>
      </div>
    `;
    document.getElementById('itemsEditList').appendChild(wrap);
    saveDraft();
  }

  function removeItem(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
    reindexItems();
    saveDraft();
  }

  function reindexItems() {
    document.querySelectorAll('.item-edit-row').forEach((row, i) => {
      row.querySelector('.item-idx').textContent = `項目 ${i + 1}`;
    });
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtNum(n) {
    if (n === '' || n === null || n === undefined || isNaN(n)) return '';
    return Number(n).toLocaleString('en-US');
  }

  let stampDataUrl = null;

  function onStampUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      stampDataUrl = reader.result;
      document.getElementById('stampPreview').style.backgroundImage = `url(${stampDataUrl})`;
      saveDraft();
    };
    reader.readAsDataURL(file);
  }

  function removeStamp() {
    stampDataUrl = null;
    document.getElementById('stampPreview').style.backgroundImage = '';
    document.getElementById('stampFile').value = '';
    saveDraft();
  }

  function collectState() {
    const items = [];
    document.querySelectorAll('.item-edit-row').forEach(row => {
      items.push({
        name: row.querySelector('.it-name').value,
        half: row.querySelector('.it-half').value,
        full: row.querySelector('.it-full').value,
        ot: row.querySelector('.it-ot').value,
        note: row.querySelector('.it-note').value
      });
    });
    return {
      companyName: document.getElementById('companyName').value,
      companySubtitle: document.getElementById('companySubtitle').value,
      companyAddr: document.getElementById('companyAddr').value,
      companyTel: document.getElementById('companyTel').value,
      companyFax: document.getElementById('companyFax').value,
      clientName: document.getElementById('clientName').value,
      quoDate: document.getElementById('quoDate').value,
      notesText: document.getElementById('notesText').value,
      items,
      stampDataUrl
    };
  }

  function saveDraft() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState())); } catch(e) {}
  }

  ['companyName','companySubtitle','companyAddr','companyTel','companyFax','clientName','quoDate','notesText']
    .forEach(id => document.getElementById(id).addEventListener('input', saveDraft));
  ['companyName','companySubtitle'].forEach(id => document.getElementById(id).addEventListener('input', renderCompanySummary));

  function renderPreview() {
    const s = collectState();
    document.getElementById('pvCompanyLine').textContent = `${s.companyName || ''}　${s.companySubtitle || ''}`;
    document.getElementById('pvAddr').textContent = s.companyAddr || '';
    const telFax = [s.companyTel ? `電話：${s.companyTel}` : '', s.companyFax ? `傳真：${s.companyFax}` : ''].filter(Boolean).join('　');
    document.getElementById('pvTelFax').textContent = telFax;
    document.getElementById('pvClient').textContent = s.clientName ? `客戶：${s.clientName}` : '';

    const rows = s.items.length ? s.items : [];
    document.getElementById('pvItemsBody').innerHTML = (rows.length ? rows : new Array(4).fill({})).map((it, i) => `
      <tr>
        <td>${it.name || it.half || it.full || it.ot ? i + 1 : ''}</td>
        <td class="name-cell">${escHtml(it.name || '')}</td>
        <td>${fmtNum(it.half)}</td>
        <td>${fmtNum(it.full)}</td>
        <td>${fmtNum(it.ot)}</td>
        <td>${escHtml(it.note || '')}</td>
      </tr>`).join('');

    document.getElementById('pvNotes').textContent = s.notesText || '';
    document.getElementById('pvDateLine').textContent = toROCDateStr(s.quoDate);

    const stampWrap = document.getElementById('pvStampWrap');
    stampWrap.innerHTML = s.stampDataUrl ? `<img src="${s.stampDataUrl}">` : '';
  }

  async function exportPdf() {
    const btn = document.getElementById('btnPdf');
    switchMode('preview');
    await new Promise(r => setTimeout(r, 60));
    btn.disabled = true;
    btn.textContent = '產生中⋯';
    try {
      const sheetEl = document.getElementById('sheet');
      const canvas = await html2canvas(sheetEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const imgW = pageW;
      const imgH = (canvas.height * imgW) / canvas.width;
      const y = imgH < pageH ? (pageH - imgH) / 2 : 0;
      pdf.addImage(imgData, 'JPEG', 0, y, imgW, Math.min(imgH, pageH));
      const s = collectState();
      const clientPart = s.clientName ? `_${s.clientName}` : '';
      pdf.save(`報價單${clientPart}_${s.quoDate || today()}.pdf`);
      saveCurrentAsRecord(false);
    } catch (err) {
      alert('產生 PDF 失敗，請再試一次。');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = '⬇ 產生 PDF';
    }
  }

  function resetForm() {
    if (!confirm('確定要清空客戶名稱、報價日期與項目內容嗎？公司資訊與備註條款不會被清除。')) return;
    document.getElementById('clientName').value = '';
    document.getElementById('quoDate').value = today();
    document.getElementById('itemsEditList').innerHTML = '';
    itemSeq = 0;
    addItem({ name: '60T', half: 12000, full: 21000, ot: 3500 });
    addItem({ name: '平台', full: 25000 });
    addItem();
    saveDraft();
  }

  function applyState(saved, useTodayForDate) {
    document.getElementById('companyName').value = saved?.companyName ?? DEFAULTS.companyName;
    document.getElementById('companySubtitle').value = saved?.companySubtitle ?? DEFAULTS.companySubtitle;
    document.getElementById('companyAddr').value = saved?.companyAddr ?? DEFAULTS.companyAddr;
    document.getElementById('companyTel').value = saved?.companyTel ?? DEFAULTS.companyTel;
    document.getElementById('companyFax').value = saved?.companyFax ?? DEFAULTS.companyFax;
    document.getElementById('clientName').value = saved?.clientName ?? '';
    document.getElementById('quoDate').value = useTodayForDate ? today() : (saved?.quoDate || today());
    document.getElementById('notesText').value = migrateNotesText(saved?.notesText);

    stampDataUrl = saved?.stampDataUrl || null;
    document.getElementById('stampPreview').style.backgroundImage = stampDataUrl ? `url(${stampDataUrl})` : '';

    document.getElementById('itemsEditList').innerHTML = '';
    itemSeq = 0;
    if (saved?.items?.length) {
      saved.items.forEach(it => addItem(it));
    } else {
      addItem({ name: '60T', half: 12000, full: 21000, ot: 3500 });
      addItem({ name: '平台', full: 25000 });
      addItem();
    }

    renderCompanySummary();
    toggleCompanyCard(false);
  }

  function initForm() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) {}
    applyState(saved, true);
    saveDraft();
  }

  initForm();
</script>
</body>
</html>
