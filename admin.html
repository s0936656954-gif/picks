<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台管理 · 微絜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f4f1ec;
      color: #1a1a1a;
      font-family: -apple-system, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
    }

    /* ── Login ── */
    #loginScreen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; padding: 24px;
    }
    .login-box {
      background: #fff; border-radius: 24px;
      padding: 36px 28px; width: 100%; max-width: 320px;
      text-align: center; box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    .login-logo { font-size: 2.2rem; margin-bottom: 10px; }
    .login-title { font-size: 1rem; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
    .login-sub { font-size: 0.72rem; color: #aaa; margin-bottom: 26px; }
    .login-input {
      width: 100%; padding: 13px 16px; border-radius: 12px;
      background: #f7f5f2; border: 1px solid #e8e4de; color: #1a1a1a;
      font-size: 1.1rem; text-align: center; letter-spacing: 6px;
      margin-bottom: 14px; outline: none;
    }
    .login-input:focus { border-color: #c8a97e; }
    .login-btn {
      width: 100%; padding: 13px; border-radius: 12px;
      background: #1a1a1a; color: #fff;
      font-size: 0.9rem; font-weight: 700; border: none; cursor: pointer;
    }
    .login-btn:active { background: #333; }
    .login-err { font-size: 0.72rem; color: #c0392b; margin-top: 10px; height: 16px; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding-bottom: 48px; }

    .dash-header {
      background: #fff; border-bottom: 1px solid #ede9e3;
      padding: 16px 18px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    .dash-title { font-size: 0.95rem; font-weight: 700; color: #1a1a1a; }
    .logout-btn {
      font-size: 0.75rem; color: #999; background: none;
      border: none; cursor: pointer; padding: 4px 0;
    }

    /* Nav tabs */
    .nav-tabs {
      background: #fff; border-bottom: 1px solid #ede9e3;
      display: flex; padding: 0 18px;
    }
    .nav-tab {
      flex: 1; text-align: center; padding: 12px 4px;
      font-size: 0.75rem; color: #aaa; cursor: pointer;
      border-bottom: 2px solid transparent; font-weight: 500;
      transition: all 0.15s;
    }
    .nav-tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 700; }

    .tab-view { display: none; }
    .tab-view.active { display: block; }

    .section-label {
      font-size: 0.65rem; color: #aaa; font-weight: 600;
      letter-spacing: 1px; padding: 20px 18px 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-label .ts { font-weight: 400; color: #c5b99a; font-size: 0.6rem; }

    /* Stat cards */
    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; padding: 0 18px;
    }
    .stat-card {
      background: #fff; border-radius: 16px;
      padding: 20px 16px; box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }
    .stat-num {
      font-size: 2.4rem; font-weight: 300; color: #1a1a1a;
      letter-spacing: -1px; line-height: 1;
    }
    .stat-sub { font-size: 0.68rem; color: #aaa; margin-top: 6px; }

    /* List card */
    .list-card {
      background: #fff; border-radius: 16px; margin: 0 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05); overflow: hidden;
    }
    .list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid #f2eeea;
    }
    .list-item:last-child { border-bottom: none; }
    .list-name { font-size: 0.82rem; color: #1a1a1a; flex: 1; min-width: 0; padding-right: 10px; }
    .list-count {
      font-size: 0.85rem; font-weight: 600; color: #1a1a1a;
      white-space: nowrap; display: flex; align-items: center; gap: 5px;
    }

    /* Board */
    .board-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px; border-bottom: 1px solid #f2eeea;
    }
    .board-item:last-child { border-bottom: none; }
    .board-rank { font-size: 0.82rem; color: #ccc; width: 24px; flex-shrink: 0; text-align: center; }
    .board-rank.top { color: #c8a97e; }
    .board-name { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
    .board-name-text { font-size: 0.82rem; color: #1a1a1a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board-time { font-size: 0.6rem; color: #bbb; }
    .board-score { font-size: 0.8rem; font-weight: 600; color: #888; white-space: nowrap; }

    /* Sort toggle */
    .sort-row { display: flex; gap: 6px; padding: 0 18px 12px; }
    .sort-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 600;
      cursor: pointer; background: #f7f5f2; color: #aaa;
      border: 1px solid #ede9e3; transition: all 0.15s;
    }
    .sort-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* Game sub-tabs */
    .game-tabs { display: flex; gap: 8px; padding: 0 18px 12px; }
    .game-tab {
      flex: 1; padding: 8px 4px; border-radius: 10px;
      font-size: 0.72rem; font-weight: 600; text-align: center;
      cursor: pointer; background: #fff; color: #aaa;
      border: 1px solid #ede9e3; transition: all 0.15s;
    }
    .game-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .game-panel { display: none; }
    .game-panel.active { display: block; }

    .refresh-row { text-align: center; padding: 22px 0 0; }
    .refresh-btn {
      background: #fff; border: 1px solid #ede9e3; color: #888;
      padding: 10px 28px; border-radius: 12px; font-size: 0.78rem; cursor: pointer;
    }
    .refresh-btn:active { background: #f7f5f2; }
    .ts-footer { font-size: 0.6rem; color: #ccc; text-align: center; padding: 8px 0 0; }

    .empty-msg { color: #ccc; font-size: 0.75rem; text-align: center; padding: 24px 0; }
    .loading-msg { color: #ccc; font-size: 0.75rem; text-align: center; padding: 20px 0; }

    /* Hour distribution chart */
    .hour-chart-wrap {
      background: #fff; border-radius: 16px; margin: 0 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,.05); padding: 16px 10px 10px; overflow: hidden;
    }
    .hour-chart { display: flex; align-items: flex-end; height: 90px; gap: 2px; }
    .hour-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
    .hour-bar { width: 100%; background: #e8ddd0; border-radius: 2px 2px 0 0; min-height: 2px; }
    .hour-bar.hi   { background: #c8a97e; }
    .hour-bar.peak { background: #1a1a1a; }
    .hour-lbl { font-size: 0.4rem; color: #ddd; margin-top: 3px; }
    .hour-lbl.show { color: #999; font-size: 0.45rem; }

    /* Day trend bars */
    .day-row { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid #f2eeea; }
    .day-row:last-child { border-bottom: none; }
    .day-label { font-size: 0.72rem; color: #888; width: 52px; flex-shrink: 0; }
    .day-bar-wrap { flex: 1; background: #f7f5f2; border-radius: 4px; height: 8px; overflow: hidden; }
    .day-bar { height: 100%; background: #c8a97e; border-radius: 4px; }
    .day-count { font-size: 0.72rem; color: #888; width: 28px; text-align: right; flex-shrink: 0; }
  </style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">📊</div>
    <div class="login-title">後台管理</div>
    <div class="login-sub">微絜專屬後台</div>
    <input type="password" id="pwInput" class="login-input" placeholder="••••••" maxlength="20">
    <button class="login-btn" onclick="doLogin()">進入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="dash-header">
    <div class="dash-title">後台管理</div>
    <button class="logout-btn" onclick="doLogout()">登出</button>
  </div>

  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchNav('flow')">流量</div>
    <div class="nav-tab" onclick="switchNav('game')">遊戲排行</div>
    <div class="nav-tab" onclick="switchNav('timing')">活躍時段</div>
  </div>

  <!-- 流量 -->
  <div id="view-flow" class="tab-view active">
    <div class="section-label">點擊流量統計 <span class="ts" id="tsLabel">本月</span></div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-num" id="sumGroup">-</div>
        <div class="stat-sub">限時開團點擊</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="sumPerm">-</div>
        <div class="stat-sub">常駐開團點擊</div>
      </div>
      <div class="stat-card" style="grid-column:1/-1;">
        <div class="stat-num" id="sumGame">-</div>
        <div class="stat-sub">遊戲點擊</div>
      </div>
    </div>

    <div class="section-label" style="margin-top:8px;">限時開團</div>
    <div class="list-card" id="clickList">
      <div class="loading-msg">載入中⋯</div>
    </div>

    <div class="section-label" style="margin-top:12px;">常駐開團</div>
    <div class="list-card" id="permList">
      <div class="loading-msg">載入中⋯</div>
    </div>

    <div class="refresh-row">
      <button class="refresh-btn" onclick="loadAll()">↻ 重新整理</button>
      <div class="ts-footer" id="tsFooter"></div>
    </div>
  </div>

  <!-- 遊戲排行 -->
  <div id="view-game" class="tab-view">
    <div class="section-label">遊戲排行榜</div>
    <div class="game-tabs">
      <div class="game-tab active" onclick="switchGame('slice')">🔪 切菜</div>
      <div class="game-tab" onclick="switchGame('knife')">🥒 刀工</div>
      <div class="game-tab" onclick="switchGame('catch')">🍽️ 接菜</div>
    </div>
    <div class="sort-row">
      <button class="sort-btn active" id="sortScore" onclick="setGameSort('score')">高分排行</button>
      <button class="sort-btn" id="sortTime" onclick="setGameSort('time')">最新紀錄</button>
    </div>
    <div id="gpanel-slice" class="game-panel active list-card">
      <div class="loading-msg">載入中⋯</div>
    </div>
    <div id="gpanel-knife" class="game-panel list-card">
      <div class="loading-msg">載入中⋯</div>
    </div>
    <div id="gpanel-catch" class="game-panel list-card">
      <div class="loading-msg">載入中⋯</div>
    </div>
  </div>

  <!-- 活躍時段 -->
  <div id="view-timing" class="tab-view">
    <div class="section-label">粉絲活躍時段分析</div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-num" id="peakHour">-</div>
        <div class="stat-sub">最活躍時段</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="totalTracked">-</div>
        <div class="stat-sub">累計追蹤點擊</div>
      </div>
    </div>

    <div class="section-label" style="margin-top:8px;">24 小時分佈</div>
    <div class="hour-chart-wrap">
      <div class="hour-chart" id="hourChart">
        <div class="loading-msg" style="width:100%;align-self:center;">載入中⋯</div>
      </div>
    </div>

    <div class="section-label" style="margin-top:12px;">近 14 天趨勢</div>
    <div class="list-card">
      <div id="dayChart"><div class="loading-msg">載入中⋯</div></div>
    </div>

    <div class="refresh-row">
      <button class="refresh-btn" onclick="loadTiming()">↻ 重新整理</button>
      <div class="ts-footer" id="tsFooterTiming"></div>
    </div>
  </div>
</div>

<script>
  const FB = 'https://jay1102-e6a99-default-rtdb.firebaseio.com';
  const PW = 'jay1102';

  document.getElementById('pwInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function doLogin() {
    if (document.getElementById('pwInput').value === PW) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadAll();
    } else {
      document.getElementById('loginErr').textContent = '密碼錯誤，再試一次';
      document.getElementById('pwInput').value = '';
    }
  }

  function doLogout() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('pwInput').value = '';
  }

  function switchNav(tab) {
    document.querySelectorAll('.nav-tab').forEach((t, i) => {
      t.classList.toggle('active', ['flow','game','timing'][i] === tab);
    });
    document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
    document.getElementById(`view-${tab}`).classList.add('active');
    if (tab === 'timing') loadTiming();
  }

  function switchGame(game) {
    document.querySelectorAll('.game-tab').forEach((t, i) => {
      t.classList.toggle('active', ['slice','knife','catch'][i] === game);
    });
    document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`gpanel-${game}`).classList.add('active');
  }

  let gameSortMode = 'score';
  const gameData = {};

  function setGameSort(mode) {
    gameSortMode = mode;
    document.getElementById('sortScore').classList.toggle('active', mode === 'score');
    document.getElementById('sortTime').classList.toggle('active', mode === 'time');
    ['slice','knife','catch'].forEach(g => renderBoard(g, gameData[g]));
  }

  function fmtTs(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    if (d.toDateString() === now.toDateString()) return `今天 ${hh}:${mi}`;
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${mm}/${dd} ${hh}:${mi}`;
  }

  async function fbGet(path) {
    try {
      const r = await fetch(`${FB}/${path}.json`);
      return r.ok ? await r.json() : null;
    } catch(e) { return null; }
  }

  async function loadAll() {
    const now = new Date();
    const ts = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    document.getElementById('tsLabel').textContent = ts;
    document.getElementById('tsFooter').textContent = `上次更新 ${ts}`;

    const [clicks, slice, knife, catchD] = await Promise.all([
      fbGet('clicks'), fbGet('scores/slice'),
      fbGet('scores/knife'), fbGet('scores/catch')
    ]);

    gameData.slice = slice; gameData.knife = knife; gameData.catch = catchD;
    renderSummary(clicks, slice, knife, catchD);
    renderClicks(clicks);
    renderBoard('slice', slice);
    renderBoard('knife', knife);
    renderBoard('catch', catchD);
  }

  function renderSummary(clicks, slice, knife, catchD) {
    const groupTotal = clicks
      ? Object.entries(clicks).filter(([k]) => k.startsWith('開團：')).reduce((a,[,v]) => a+v, 0)
      : 0;
    document.getElementById('sumGroup').textContent = groupTotal;

    const permTotal = clicks
      ? Object.entries(clicks).filter(([k]) => k.startsWith('常駐：')).reduce((a,[,v]) => a+v, 0)
      : 0;
    document.getElementById('sumPerm').textContent = permTotal;

    const gameTotal = clicks
      ? Object.entries(clicks).filter(([k]) => k.startsWith('小遊戲')).reduce((a,[,v]) => a+v, 0)
      : 0;
    document.getElementById('sumGame').textContent = gameTotal;
  }

  function renderClicks(data) {
    renderList('clickList', data, '開團：', '尚無限時開團點擊');
    renderList('permList', data, '常駐：', '尚無常駐開團點擊');
  }

  function renderList(elId, data, prefix, emptyMsg) {
    const el = document.getElementById(elId);
    if (!data) { el.innerHTML = `<div class="empty-msg">${emptyMsg}</div>`; return; }
    const entries = Object.entries(data)
      .filter(([k]) => k.startsWith(prefix))
      .sort((a,b) => b[1]-a[1]);
    if (!entries.length) { el.innerHTML = `<div class="empty-msg">${emptyMsg}</div>`; return; }
    el.innerHTML = entries.map(([k, v]) => `
      <div class="list-item">
        <div class="list-name">${k.replace(prefix,'')}</div>
        <div class="list-count">👆 ${v}</div>
      </div>`).join('');
  }

  function renderBoard(game, data) {
    const el = document.getElementById(`gpanel-${game}`);
    if (!data) { el.innerHTML = '<div class="empty-msg">尚無紀錄</div>'; return; }
    const all = Object.values(data);
    if (!all.length) { el.innerHTML = '<div class="empty-msg">尚無紀錄</div>'; return; }

    const board = gameSortMode === 'time'
      ? all.sort((a,b) => (b.ts||0) - (a.ts||0)).slice(0, 20)
      : all.sort((a,b) => b.score - a.score).slice(0, 10);

    const medals = ['🥇','🥈','🥉','4','5','6','7','8','9','10'];
    el.innerHTML = board.map((e, i) => {
      const rankLabel = gameSortMode === 'time'
        ? `<span class="board-rank">${i+1}</span>`
        : `<span class="board-rank ${i < 3 ? 'top' : ''}">${medals[i]}</span>`;
      return `<div class="board-item">
        ${rankLabel}
        <span class="board-name">
          <span class="board-name-text">@${e.name}</span>
          <span class="board-time">${fmtTs(e.ts)}</span>
        </span>
        <span class="board-score">${e.score} 分</span>
      </div>`;
    }).join('');
  }

  async function loadTiming() {
    const now = new Date();
    const ts = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    document.getElementById('tsFooterTiming').textContent = `上次更新 ${ts}`;
    const data = await fbGet('click_hours');
    renderTiming(data);
  }

  function renderTiming(data) {
    const noData = () => {
      document.getElementById('hourChart').innerHTML = '<div class="empty-msg" style="width:100%;align-self:center;">尚無資料</div>';
      document.getElementById('dayChart').innerHTML = '<div class="empty-msg">尚無資料</div>';
      document.getElementById('peakHour').textContent = '-';
      document.getElementById('totalTracked').textContent = '0';
    };
    if (!data) { noData(); return; }

    const hourTotals = new Array(24).fill(0);
    const dayTotals = {};

    Object.entries(data).forEach(([day, hours]) => {
      if (typeof hours !== 'object') return;
      dayTotals[day] = 0;
      Object.entries(hours).forEach(([h, count]) => {
        const hr = parseInt(h, 10);
        if (hr >= 0 && hr < 24) {
          hourTotals[hr] += count;
          dayTotals[day] += count;
        }
      });
    });

    const maxHourVal = Math.max(...hourTotals, 1);
    const peakHr = hourTotals.indexOf(Math.max(...hourTotals));
    const totalClicks = hourTotals.reduce((a, b) => a + b, 0);

    document.getElementById('peakHour').textContent = `${peakHr}:00`;
    document.getElementById('totalTracked').textContent = totalClicks;

    // 24h bar chart
    document.getElementById('hourChart').innerHTML = hourTotals.map((cnt, h) => {
      const pct = Math.max(Math.round((cnt / maxHourVal) * 100), 2);
      const showLbl = h % 6 === 0;
      const cls = h === peakHr ? 'peak' : cnt > maxHourVal * 0.5 ? 'hi' : '';
      return `<div class="hour-col">
        <div class="hour-bar ${cls}" style="height:${pct}%"></div>
        <div class="hour-lbl ${showLbl ? 'show' : ''}">${showLbl ? h : '·'}</div>
      </div>`;
    }).join('');

    // Day trend (last 14 days, newest first)
    const sortedDays = Object.keys(dayTotals).sort().reverse().slice(0, 14);
    if (!sortedDays.length) {
      document.getElementById('dayChart').innerHTML = '<div class="empty-msg">尚無資料</div>';
      return;
    }
    const maxDayVal = Math.max(...sortedDays.map(d => dayTotals[d]), 1);
    document.getElementById('dayChart').innerHTML = sortedDays.map(day => {
      const cnt = dayTotals[day];
      const pct = Math.round((cnt / maxDayVal) * 100);
      return `<div class="day-row">
        <div class="day-label">${day.slice(5)}</div>
        <div class="day-bar-wrap"><div class="day-bar" style="width:${pct}%"></div></div>
        <div class="day-count">${cnt}</div>
      </div>`;
    }).join('');
  }
</script>
</body>
</html>
